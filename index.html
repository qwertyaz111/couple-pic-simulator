<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤳ツーショットシミュレーター</title>
    <style>
        :root { --panel-width: 300px; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: #ffffff; overflow: hidden; }
        #ui-panel {
            position: absolute; top: 10px; left: 10px; width: var(--panel-width);
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 15px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-height: calc(100vh - 40px); overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            touch-action: auto; transition: all 0.3s ease;
        }
        #canvas-container { width: 100vw; height: 100vh; cursor: move; touch-action: none; }

        @media screen and (max-width: 480px) { :root { --panel-width: 85vw; } }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            :root { --panel-width: 260px; }
            #ui-panel { top: 5px; left: 5px; padding: 10px; max-height: calc(100vh - 10px); }
            .app-title { font-size: 1.1rem; }
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        #toggle-text { font-size: 12px; font-weight: bold; color: #666; background: #eee; padding: 2px 8px; border-radius: 10px; }
        
        /* スマホカメラ視点用の最小化（タイトルも消す） */
        .minimized { width: auto !important; padding: 10px 15px !important; }
        .minimized #ui-content, .minimized .app-title { display: none; }

        /* 通常視点用の折り畳み（コンテンツのみ消す） */
        .collapsed #ui-content { display: none; }

        .app-title { font-size: 1.4rem; margin: 0; color: #333; text-align: center; font-weight: bold; flex-grow: 1; }
        .app-description { font-size: 11px; color: #777; margin-top: 8px; margin-bottom: 5px; line-height: 1.5; text-align: center; }

        .input-group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .group-a { background: #fff5f0; border: 1px solid #ffe0d0; }
        .group-b { background: #f0f7ff; border: 1px solid #d0e7ff; }
        .group-s { background: #f5f5f5; border: 1px solid #e0e0e0; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .section-header strong { font-size: 15px; color: #444; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .input-item { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .hint { font-size: 10px; color: #999; margin-bottom: 2px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; color: #333; width: 100%; box-sizing: border-box; }

        .anim-controls { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-anim { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .btn-anim.active { background: #333; color: #fff; border-color: #333; }
        
        .color-picker { width: 100%; height: 38px; border: 2px solid #999; border-radius: 4px; cursor: pointer; padding: 0; background: none; appearance: none; -webkit-appearance: none; }
        
        .switch-btn { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .switch-btn:active { background: #000; transform: scale(0.98); }

        .share-btn { 
            width: 100%; 
            padding: 12px; 
            background: #000;
            color: white;
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 13px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            text-decoration: none; 
            margin-top: 10px;
        }
        .share-btn:active { transform: scale(0.98); opacity: 0.8; }

        .info-box { background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee; }
        .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
        .info-label { color: #555; font-size: 12px; font-weight: bold; }
        .info-value { font-weight: 800; font-size: 18px; color: #2c3e50; }
        .unit { font-size: 11px; margin-left: 3px; color: #7f8c8d; }

        .other-tools-link {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 10px;
            text-align: center;
        }
        .other-tools-link a {
            text-decoration: none;
            color: #333;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #333;
            padding: 8px 15px;
            border-radius: 30px;
            display: inline-block;
            transition: 0.3s;
            margin: 4px;
        }
        .other-tools-link a:hover {
            background: #333;
            color: #fff;
        }

        .usage-notes {
            font-size: 10px;
            color: #999;
            margin-top: 12px;
            line-height: 1.5;
            text-align: center;
        }
        
        #view-label { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="panel-header" onclick="togglePanel()">
        <h1 class="app-title">🤳ツーショットシミュレーター</h1>
        <span id="toggle-text">閉じる</span>
    </div>

    <div id="ui-content">
        <p class="app-description">性別と身長からツーショットの雰囲気をシミュレーションできます。</p>
        
        <div class="input-group group-a">
            <div class="section-header"><strong>A</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名前</span><input type="text" id="nameA" placeholder="名前A" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性別</span><select id="genderA" onchange="updateScene()"><option value="male">男</option><option value="female" selected>女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身長 (cm)</span><input type="number" id="heightA" value="158.0" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorA" class="color-picker" value="#ffcc99" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-b">
            <div class="section-header"><strong>B</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名前</span><input type="text" id="nameB" placeholder="名前B" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性別</span><select id="genderB" onchange="updateScene()"><option value="male" selected>男</option><option value="female">女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身長 (cm)</span><input type="number" id="heightB" value="171.5" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-s">
            <div class="section-header"><strong>スマホの設定</strong></div>
            <div class="input-row">
                <div class="input-item">
                    <span class="hint">スマホの色</span>
                    <input type="color" id="colorS" class="color-picker" value="#222222" oninput="updateScene()">
                </div>
            </div>
        </div>

        <div style="padding: 0 5px;">
            <span class="hint">🤳 スマホを持つ人</span>
            <div class="anim-controls">
                <button id="shooter-A" class="btn-anim" onclick="setShooter('A')">A</button>
                <button id="shooter-B" class="btn-anim active" onclick="setShooter('B')">B</button>
            </div>

            <span class="hint">📍 持つ人の立ち位置</span>
            <div class="anim-controls">
                <button id="pos-left" class="btn-anim active" onclick="setSide('left')">左側</button>
                <button id="pos-right" class="btn-anim" onclick="setSide('right')">右側</button>
            </div>

            <button class="switch-btn" onclick="switchView()">🔄 視点を切り替える</button>
        </div>
        
        <div id="info-container">
            <div class="info-box" id="info"></div>
            
            <button class="share-btn" onclick="shareToX()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                </svg>で結果をシェアする
            </button>

            <div class="other-tools-link">
                <p style="font-size: 10px; color: #888; margin-bottom: 8px;">こちらもチェック❣🤩</p>
                <a href="https://qwertyaz111.github.io/my-site-hub/">ツール・シミュレーター一覧</a>
            </div>
            <div class="usage-notes">
                スクショ投稿や加工、トレース等はご自由にお楽しみください。<br>
                ※営利目的や商用利用はご遠慮ください。
            </div>
        </div>
    </div>
</div>

<div id="view-label">三人称視点</div>
<div id="canvas-container"></div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

    let scene, camera, renderer, clock;
    let personA, personB, walkGroup, smartphone, screenMesh;
    let camViewCamera, renderTarget; 
    let currentView = '3rd';
    let shooterRole = 'B';
    let shooterSide = 'left';
    let rotation = { x: 0, y: 0 }, camDist = 2.5, isDragging = false, previousTouch = null, initialPinchDist = null;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.rotation.order = 'YXZ';

        camViewCamera = new THREE.PerspectiveCamera(60, 0.142 / 0.065, 0.01, 1000);
        renderTarget = new THREE.WebGLRenderTarget(512, 256);
        
        renderTarget.texture.wrapS = THREE.RepeatWrapping;
        renderTarget.texture.wrapT = THREE.RepeatWrapping;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 2.5));
        const grid = new THREE.GridHelper(200, 400, 0xeeeeee, 0xf5f5f5);
        scene.add(grid);

        walkGroup = new THREE.Group();
        scene.add(walkGroup);

        const phoneGeo = new THREE.BoxGeometry(0.1496, 0.0715, 0.00795);
        const phoneMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        smartphone = new THREE.Mesh(phoneGeo, phoneMat);
        
        const screenGeo = new THREE.PlaneGeometry(0.142, 0.065);
        const screenMat = new THREE.MeshBasicMaterial({ map: renderTarget.texture });
        screenMesh = new THREE.Mesh(screenGeo, screenMat);
        
        screenMesh.position.z = -0.0041; 
        screenMesh.rotation.y = Math.PI; 
        screenMesh.rotation.z = Math.PI; 
        
        smartphone.add(screenMesh);

        clock = new THREE.Clock();
        setupControls();

        window.addEventListener('resize', onWindowResize);
        window.updateScene = updateScene;
        window.switchView = switchView;
        window.setShooter = setShooter;
        window.setSide = setSide;
        window.shareToX = shareToX;
        
        // 視点に応じたトグル機能
        window.togglePanel = () => {
            const panel = document.getElementById('ui-panel');
            const text = document.getElementById('toggle-text');
            
            if (currentView === 'cam') {
                // スマホカメラ視点：タイトルも消す最小化
                const isMinimized = panel.classList.toggle('minimized');
                panel.classList.remove('collapsed'); // 他のクラスと干渉しないように
                text.innerText = isMinimized ? '設定を表示' : '非表示';
            } else {
                // それ以外の視点：コンテンツのみ消す折り畳み
                const isCollapsed = panel.classList.toggle('collapsed');
                panel.classList.remove('minimized');
                text.innerText = isCollapsed ? '開く' : '閉じる';
            }
        };

        updateScene();
        animate();
    }

    function shareToX() {
        const nA = document.getElementById('nameA').value || 'A';
        const nB = document.getElementById('nameB').value || 'B';
        const hA = parseFloat(document.getElementById('heightA').value) || 158.0;
        const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
        const text = `${nA}(${hA.toFixed(1)}cm)と${nB}(${hB.toFixed(1)}cm)が一緒にツーショット！\n#ツーショットシミュレーター\n`;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function setShooter(role) {
        shooterRole = role;
        document.getElementById('shooter-A').classList.toggle('active', role === 'A');
        document.getElementById('shooter-B').classList.toggle('active', role === 'B');
        updateScene();
    }

    function setSide(side) {
        shooterSide = side;
        document.getElementById('pos-left').classList.toggle('active', side === 'left');
        document.getElementById('pos-right').classList.toggle('active', side === 'right');
        updateScene();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function createMannequin(color, heightCm, gender, name, role) {
        const group = new THREE.Group();
        const h = heightCm * 0.01;
        const bodyMat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.9 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

        const headH = h * 0.13, neckH = h * 0.05, torsoH = h * 0.37, legH = h * 0.45;
        const torsoW = (gender === 'male' ? 0.26 : 0.21) * (h/1.7);
        const torsoDepth = torsoW * 0.5;

        const spine = new THREE.Group(); spine.position.y = legH; 
        const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoDepth), bodyMat);
        torso.position.y = torsoH * 0.5; spine.add(torso);
        group.add(spine); group.spine = spine;

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(headH*0.3, headH*0.3, neckH, 16), bodyMat);
        neck.position.y = torsoH + (neckH * 0.5); spine.add(neck);

        const headBox = new THREE.Group(); headBox.position.y = torsoH + neckH + (headH * 0.5);
        const head = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.8, 16, 16), bodyMat);
        headBox.add(head);
        [-1, 1].forEach(side => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.12, 12, 12), eyeMat);
            eye.position.set(side * (headH * 0.28), 0, (headH * 0.7)); headBox.add(eye);
        });
        spine.add(headBox); group.headParts = headBox;

        group.arms = [];
        [-1, 1].forEach(side => {
            const anchor = new THREE.Group();
            anchor.position.set(side * (torsoW * 0.6), torsoH - (torsoW*0.05), 0);
            const armLen = h * 0.38;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.25, armLen, torsoW*0.25), bodyMat);
            mesh.position.y = -armLen * 0.5; anchor.add(mesh); spine.add(anchor); group.arms.push(anchor);
        });

        group.legs = [];
        [-1, 1].forEach(side => {
            const anchor = new THREE.Group(); anchor.position.set(side * (torsoW * 0.25), legH, 0);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.35, legH, torsoW*0.35), bodyMat);
            mesh.position.y = -legH * 0.5; anchor.add(mesh); group.add(anchor); group.legs.push(anchor);
        });

        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d'); ctx.font = "bold 40px sans-serif"; ctx.fillStyle = "#333"; ctx.textAlign = "center";
        ctx.fillText(`${name || role} (${heightCm.toFixed(1)}cm)`, 256, 64);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
        sprite.scale.set(1.2, 0.3, 1); sprite.position.y = h + 0.2; group.add(sprite);
        group.nameTag = sprite;

        group.userData = { height: h, role: role, torsoW: torsoW, armLen: h * 0.38, legH: legH, torsoH: torsoH, neckH: neckH, headH: headH };
        return group;
    }

    function updateScene() {
        const hA = parseFloat(document.getElementById('heightA').value)||158, hB = parseFloat(document.getElementById('heightB').value)||171.5;
        const hDiffAbs = Math.abs(hA - hB);
        
        if(personA) walkGroup.remove(personA); if(personB) walkGroup.remove(personB);
        personA = createMannequin(document.getElementById('colorA').value, hA, document.getElementById('genderA').value, document.getElementById('nameA').value, 'A');
        personB = createMannequin(document.getElementById('colorB').value, hB, document.getElementById('genderB').value, document.getElementById('nameB').value, 'B');
        
        const shooter = shooterRole === 'A' ? personA : personB;
        const other = shooterRole === 'A' ? personB : personA;

        const minContactDist = (personA.userData.torsoW + personB.userData.torsoW) * 0.48; 
        const baseDist = 0.18; 
        const dist = Math.max(minContactDist, baseDist + (hDiffAbs * 0.0006)); 

        const offsetZ = 0.08; 
        const offsetX = 0.04; 

        if (shooterSide === 'left') {
            shooter.position.set(-dist + offsetX, 0, -offsetZ);
            other.position.set(dist - offsetX, 0, offsetZ);
            renderTarget.texture.repeat.set(-1, 1);
            renderTarget.texture.offset.set(1, 0);
        } else {
            shooter.position.set(dist - offsetX, 0, -offsetZ);
            other.position.set(-dist + offsetX, 0, offsetZ);
            renderTarget.texture.repeat.set(1, -1);
            renderTarget.texture.offset.set(0, 1);
        }

        walkGroup.add(personA, personB);

        applyPose(shooter, other, true);
        applyPose(other, shooter, false);

        const armSide = shooterSide === 'left' ? 0 : 1; 
        const hand = shooter.arms[armSide].children[0];
        hand.add(smartphone);
        
        // スマホの色を更新
        smartphone.material.color.set(document.getElementById('colorS').value);

        smartphone.rotation.set(0, 0, 0); 
        smartphone.rotation.x = Math.PI / 2;
        smartphone.rotation.z = (armSide === 0 ? Math.PI : 0); 
        smartphone.position.set(armSide === 0 ? 0.07 : -0.07, -shooter.userData.armLen * 0.5, 0.05);

        const names = {A: document.getElementById('nameA').value||'A', B: document.getElementById('nameB').value||'B'};
        const labels = {'3rd':'三人称視点','A':names.A+'の視点','B':names.B+'の視点','cam':'スマホカメラ視点'};
        document.getElementById('view-label').innerText = labels[currentView];
        
        // 視点切り替え時にトグルの文字をリセット
        const text = document.getElementById('toggle-text');
        const panel = document.getElementById('ui-panel');
        panel.classList.remove('minimized', 'collapsed');
        text.innerText = (currentView === 'cam') ? '非表示' : '閉じる';

        updateVisibilityForMain();

        document.getElementById('info').innerHTML = `
            <div class="info-row"><span class="info-label">📏 身長差</span><span class="info-value">${hDiffAbs.toFixed(1)}<span class="unit">cm</span></span></div>
        `;
    }

    function applyPose(p, other, isShooter) {
        const hDiff = p.userData.height - other.userData.height;
        const armSide = shooterSide === 'left' ? 0 : 1;
        
        let currentBend = 0;
        if (hDiff > 0.05) {
            currentBend = Math.min(0.5, hDiff * 2.0);
            p.legs.forEach(l => l.rotation.x = -currentBend * 0.8);
            p.spine.rotation.x = currentBend;
            const headDepthOffset = Math.sin(currentBend) * (p.userData.torsoH + p.userData.neckH + p.userData.headH * 0.5);
            p.position.z += -headDepthOffset; 
            p.position.y = -(1 - Math.cos(currentBend)) * p.userData.legH;
        } else {
            p.position.y = 0;
        }

        if (isShooter) {
            const arm = p.arms[armSide];
            const armBaseAngle = -Math.PI/1.8 + (hDiff * 0.4);
            arm.rotation.x = armBaseAngle - currentBend; 
            arm.rotation.z = armSide === 0 ? -0.4 : 0.4;
        } else {
            p.rotation.y = shooterSide === 'left' ? -0.25 : 0.25;
        }

        setTimeout(() => {
            const shooterObj = shooterRole === 'A' ? personA : personB;
            const shooterArm = shooterObj.arms[armSide];
            const camPos = new THREE.Vector3();
            shooterArm.children[0].getWorldPosition(camPos);
            camPos.add(new THREE.Vector3(armSide === 0 ? -0.1 : 0.1, 0.05, 0.35));
            p.headParts.lookAt(camPos);
        }, 0);
    }

    function animate() {
        requestAnimationFrame(animate);

        const camPos = new THREE.Vector3();
        smartphone.getWorldPosition(camPos);
        camViewCamera.position.copy(camPos);
        
        const posA = new THREE.Vector3(), posB = new THREE.Vector3();
        personA.headParts.getWorldPosition(posA);
        personB.headParts.getWorldPosition(posB);
        const midPoint = new THREE.Vector3().addVectors(posA, posB).multiplyScalar(0.5);
        camViewCamera.lookAt(midPoint);

        personA.nameTag.visible = false;
        personB.nameTag.visible = false;
        personA.headParts.visible = true; 
        personB.headParts.visible = true;
        smartphone.visible = false;
        
        renderer.setRenderTarget(renderTarget);
        renderer.render(scene, camViewCamera);
        renderer.setRenderTarget(null);
        
        smartphone.visible = true;
        updateVisibilityForMain();

        if (currentView === '3rd') {
            const center = new THREE.Vector3(0, personA.userData.height * 0.6, 0);
            camera.position.set(center.x + Math.sin(rotation.y) * camDist, center.y + Math.sin(rotation.x) * camDist, center.z + Math.cos(rotation.y) * camDist);
            camera.lookAt(center);
        } else if (currentView === 'cam') {
            camera.position.copy(camViewCamera.position);
            camera.quaternion.copy(camViewCamera.quaternion);
        } else {
            const self = (currentView === 'A' ? personA : personB);
            const headPos = new THREE.Vector3();
            self.headParts.getWorldPosition(headPos);
            camera.position.copy(headPos);
            const targetPos = new THREE.Vector3(0, 0, 10);
            self.headParts.localToWorld(targetPos);
            camera.lookAt(targetPos);
            camera.rotation.x += rotation.x;
            camera.rotation.y += rotation.y;
        }
        renderer.render(scene, camera);
    }

    function updateVisibilityForMain() {
        personA.headParts.visible = true;
        personB.headParts.visible = true;
        personA.nameTag.visible = true;
        personB.nameTag.visible = true;

        if (currentView === 'A') {
            personA.headParts.visible = false;
            personA.nameTag.visible = false;
        } else if (currentView === 'B') {
            personB.headParts.visible = false;
            personB.nameTag.visible = false;
        }
    }

    function switchView() {
        const order = ['3rd', 'A', 'B', 'cam'];
        currentView = order[(order.indexOf(currentView) + 1) % order.length];
        rotation.x = 0; rotation.y = 0;
        updateScene();
    }

    function setupControls() {
        const c = document.getElementById('canvas-container');
        const move = (dx, dy) => { 
            rotation.y -= dx * 0.005; 
            rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotation.x - dy * 0.005));
        };

        c.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if(isDragging) move(e.movementX, e.movementY); });

        c.addEventListener('wheel', e => {
            if (currentView === '3rd') {
                camDist += e.deltaY * 0.002;
                camDist = Math.max(0.5, Math.min(10, camDist));
            }
        }, { passive: true });

        c.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousTouch = e.touches[0];
                initialPinchDist = null;
            } else if (e.touches.length === 2 && currentView === '3rd') {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: false });

        window.addEventListener('touchend', () => { 
            isDragging = false; 
            initialPinchDist = null;
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && isDragging && previousTouch) {
                if (e.cancelable) e.preventDefault();
                const touch = e.touches[0];
                move(touch.clientX - previousTouch.clientX, touch.clientY - previousTouch.clientY);
                previousTouch = touch;
            } else if (e.touches.length === 2 && initialPinchDist !== null && currentView === '3rd') {
                if (e.cancelable) e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = currentDist - initialPinchDist;
                camDist -= diff * 0.005;
                camDist = Math.max(0.5, Math.min(10, camDist));
                initialPinchDist = currentDist;
            }
        }, { passive: false });
    }

    init();
</script>
</body>
</html>
